[build-system]
requires = ["setuptools>=84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lovelace-expander-card"
version = "0.0.1"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "ha-testcontainer[test]>=2.12.0",
    "pytest>=7.0",
    "PyYAML>=6.0",
    "playwright>=1.64.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
