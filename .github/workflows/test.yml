  visual-tests:
    permissions:
      contents: read
    name: Visual Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 #v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install --no-build

      - name: Install test dependencies
        run: uv sync --extra test --locked --no-build

      - name: Install Playwright browsers
        run: uv run --no-build playwright install --with-deps chromium

      - name: Run visual tests
        run: uv run --no-build pytest tests/